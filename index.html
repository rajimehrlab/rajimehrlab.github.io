<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortical Cartography Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070A; --ink:#EAF2F5; --dim:#7C8A93; --glow:#4FD8E8; --line:rgba(234,242,245,0.14);
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--ink); font-family:var(--font-body); overflow-x:hidden;}
  a{color:inherit; text-decoration:none;}

  header{position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:26px 44px;}
  nav{display:flex; align-items:center; gap:14px; font-family:var(--font-display); font-size:0.8rem; letter-spacing:0.08em;}
  nav a{opacity:0.85; transition:opacity .2s ease, color .2s ease; white-space:nowrap;}
  nav a:hover{opacity:1; color:var(--glow);}
  nav .sep{color:var(--dim);}
  .menu-icon{position:absolute; right:44px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:5px; cursor:pointer;}
  .menu-icon span{width:26px; height:2px; background:var(--ink); display:block;}
  @media (max-width:1100px){ nav{display:none;} }

  .hero{position:relative; min-height:100vh; text-align:center; padding:0;}
  .glow-bg{position:absolute; inset:0; background:radial-gradient(ellipse 620px 520px at 50% 46%, rgba(79,216,232,0.16), transparent 70%); z-index:0;}
  .brain-wrap{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:1;}
  .brain-wrap img{
    width:min(760px, 92vw); height:auto;
    filter:brightness(1.08) contrast(1.15) saturate(0.9) drop-shadow(0 0 40px rgba(79,216,232,0.35));
    mix-blend-mode:screen;
    -webkit-mask-image:radial-gradient(ellipse 55% 55% at 50% 50%, black 35%, transparent 72%);
    mask-image:radial-gradient(ellipse 55% 55% at 50% 50%, black 35%, transparent 72%);
  }
  .hero-title{position:absolute; top:120px; left:50%; transform:translateX(-50%); z-index:2; width:100%; padding:0 24px;}
  .hero-tagline-wrap{position:absolute; bottom:160px; left:50%; transform:translateX(-50%); z-index:2; width:100%;}
  .hero h1{font-family:var(--font-display); font-weight:700; font-size:clamp(1.8rem,5.2vw,4rem); letter-spacing:0.02em; line-height:1.08; text-shadow:0 0 28px rgba(79,216,232,0.45);}
  .hero h1 .lead{display:block; font-weight:500; font-size:0.42em; letter-spacing:0.14em; color:var(--dim); text-shadow:none; margin-bottom:10px;}
  .hero .tagline{margin-top:22px; font-family:var(--font-display); font-weight:500; font-size:clamp(1rem,2vw,1.3rem); letter-spacing:0.12em; color:var(--dim);}
  .side-label{position:fixed; top:50%; transform:translateY(-50%) rotate(180deg); writing-mode:vertical-rl; font-family:var(--font-display); font-size:0.72rem; letter-spacing:0.24em; color:var(--dim); z-index:5;}
  .side-label.left{left:38px;}
  .side-label.right{right:38px; transform:translateY(-50%);}
  @media (max-width:700px){ .side-label{display:none;} }

  .scroll-cue{position:absolute; bottom:44px; left:50%; transform:translateX(-50%); z-index:2; text-align:center; font-family:var(--font-display); font-size:0.72rem; letter-spacing:0.2em; color:var(--dim);}
  .scroll-cue .stem{width:1px; height:38px; background:var(--line); margin:14px auto 0;}

  @media (prefers-reduced-motion:no-preference){
    .pulse{animation:pulse 3.2s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:0.55;} 50%{opacity:1;}}
  }
  .dropdown{position:relative; display:inline-flex; align-items:center;}
.dropdown-menu{
  position:absolute; top:100%; left:50%; transform:translateX(-50%) translateY(6px);
  background:#0A0E13; border:1px solid var(--line); border-radius:8px;
  padding:10px 0; margin-top:14px;
  display:flex; flex-direction:column; min-width:180px;
  opacity:0; visibility:hidden; transition:opacity .18s ease, transform .18s ease;
  z-index:30;
}
.dropdown-menu a{
  padding:10px 18px; font-size:0.78rem; letter-spacing:0.06em; text-align:left; white-space:nowrap;
}
.dropdown-menu a:hover{background:rgba(79,216,232,0.08);}
.dropdown:hover .dropdown-menu{opacity:1; visibility:visible; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
<nav>
  <div class="dropdown">
    <a href="people.html">Members</a>
    <div class="dropdown-menu">
      <a href="postdocs.html">Postdocs</a>
      <a href="phds.html">PhD Students</a>
      <a href="research-assistants.html">Research Assistants</a>
      <a href="alumni.html">Alumni</a>
    </div>
  </div>
  <span class="sep">|</span>
  <a href="publications.html">Publications</a><span class="sep">|</span>
  <a href="research.html">Projects</a><span class="sep">|</span>
  <a href="events.html">Events</a><span class="sep">|</span>
  <a href="opportunities.html">Opportunities</a><span class="sep">|</span>
  <a href="contact.html">Contact Us</a>
</nav>
</header>

<section class="hero">
  <div class="glow-bg"></div>
  <div class="brain-wrap">
    <img src="assets/img/brain-hero.jpg" alt="Illustration of a glowing neural network shaped like a brain">
  </div>

  <div class="hero-title">
    <h1><span class="lead">Reza Rajimehr's</span>CORTICAL CARTOGRAPHY LAB</h1>
  </div>

  <div class="hero-tagline-wrap">
    <p class="tagline">MAPPING THE HUMAN BRAIN</p>
  </div>

</section>

</body>
</html>
